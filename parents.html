  if (best) return best;

/* which lesson a group has today: the lesson with attendance marked today; before attendance is ticked, the lesson after the last one most of the group has finished in class (it is a class day for Toq Mon/Wed/Fri, for Juft Tue/Thu/Sat) */
function planFor(g){
  if (!B) return null; var rows = (B.rows || []).filter(function(r){ return r.g === g; }), us = B.units || []; if (!rows.length || !us.length) return null;
  var at = 0; rows.forEach(function(r){ (r.us || []).forEach(function(e){ if (String(e.ad || "").slice(0, 10) === B.today && +e.u > at) at = +e.u; }); });
  var wd = new Date(B.today + "T00:00:00Z").getUTCDay(), cd = (g === "A" ? [1, 3, 5] : [2, 4, 6]).indexOf(wd) > -1, u = at;
  if (!u){ var m = 0; us.forEach(function(x){ var n = rows.filter(function(r){ var e = ent(r, x); return e && e.ck; }).length; if (n * 2 > rows.length) m = x; }); var i = us.indexOf(m); u = m ? (us[i + 1] || m) : us[0]; }

}
function plans(g){ var gs = g ? [g] : ["A", "B"], o = []; gs.forEach(function(x){ var p = planFor(x); if (p) o.push({g: x, u: p.u, now: p.now}); }); return o; }

function row(a, b){ return '<div>' + esc(a) + '</div><div>' + b + '</div>'; }
function dayTxt(s){ s = String(s || "").slice(0, 10).split("-"); return s.length === 3 ? s[2] + "." + s[1] : ""; }

  if (h.test){ var pc = Math.round(st.pct || 0); r += row(t("tpct"), '<span style="color:' + (pc >= pass ? "var(--ok)" : "var(--bad)") + '">' + pc + '% · ' + (pc >= pass ? t("pass") : t("fail")) + '</span>'); if (st.best != null && +st.tries > 1) r += row(t("tbest"), Math.round(st.best) + "%"); }

  $("dlg").classList.remove("hide"); document.body.classList.add("lock"); $("dx").focus();
  loadDlg(); clearInterval(MT); MT = setInterval(function(){ if (!document.hidden) loadDlg(); }, 15000);
}
function loadDlg(){
  if (!MSID) return;
  var id = MSID;
  rpc("parent_novel", {p_sid: id}).then(function(d){ if (id !== MSID) return; if (!d || !d.ok){ $("dbody").innerHTML = '<div class="msg">' + t("nodata") + '</div>'; return; } MD = d; drawDlg(); }).catch(function(){ if (!MD) $("dbody").innerHTML = '<div class="msg">' + t("net") + '</div>'; });
}
function closeDlg(){ MSID = 0; MD = null; clearInterval(MT); $("dlg").classList.add("hide"); document.body.classList.remove("lock"); try { if (LASTFOCUS && LASTFOCUS.focus) LASTFOCUS.focus(); } catch (e) {} }
$("dx").onclick = closeDlg;
$("dlg").onclick = function(e){ if (e.target === $("dlg")) closeDlg(); };
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("dlg").classList.contains("hide")) closeDlg(); });
$("dm_home").onclick = function(){ MM = "home"; drawDlg(); };
$("dm_class").onclick = function(){ MM = "class"; drawDlg(); };
$("dlnav").onclick = function(e){ var b = e.target.closest("button[data-u]"); if (!b) return; MU = +b.getAttribute("data-u"); MUPICK = true; drawDlg(); };

var tipHide = ls("nnt_parent_tip") === "1" || (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
if (tipHide) $("tip").style.display = "none";
$("tipx").onclick = function(){ ls("nnt_parent_tip", "1"); $("tip").style.display = "none"; };
applyLang(); loadBoard(true);
clearInterval(T); T = setInterval(function(){ if (!document.hidden) loadBoard(false); }, 20000);
</script></body></html>
