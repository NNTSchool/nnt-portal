<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>NNT School · Ota-onalar uchun</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=15">
<style>
.pwrap{max-width:900px;margin:0 auto;padding:18px 14px 60px}
.phero{position:relative;overflow:hidden;border-radius:22px;padding:26px 18px 22px;text-align:center;color:#fff;background:radial-gradient(120% 90% at 15% 0%,#1d4fbf 0%,#0b2a6e 45%,#071733 100%);border:1.5px solid rgba(239,220,168,.55);box-shadow:0 14px 34px -14px rgba(7,23,51,.55)}
.phero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 10%,rgba(239,220,168,.28),transparent 40%);pointer-events:none}
.phero>*{position:relative}
.phero img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2.5px solid var(--gold2);box-shadow:0 0 0 6px rgba(200,150,58,.22);margin-bottom:8px}
.phero h1{color:#fff;font-size:28px;margin:2px 0 6px}.phero h1 em{font-style:normal;background:linear-gradient(90deg,#fff1b8,#ffc93c,#ff8fb8);-webkit-background-clip:text;background-clip:text;color:transparent}
.phero p{margin:0 auto;max-width:440px;color:#dbe4fb;font-size:16px}
.sbox{margin-top:14px;border-top:3px solid var(--gold);border-radius:18px}
.sbox label{font-size:17px;color:var(--ink);margin:0 0 8px}
#q{font-size:20px;padding:16px 16px}
.plist div{padding:16px 14px;font-size:19px;font-weight:600;border-bottom:1px solid var(--line);cursor:pointer}
.plist div:active,.plist div:hover{background:var(--gold3)}
.plist{border:1.5px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:#fff}
.plist:empty{display:none}
.nf{margin-top:12px;padding:14px;border-radius:12px;background:#fff6e0;color:#7a4300;font-size:16px}
.back2{background:none;border:0;color:var(--royal);font:700 17px var(--sans);padding:10px 0;cursor:pointer}
.kid{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.kid h2{font-size:28px}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.sum{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:12px 14px}
.sum b{display:block;font:700 30px var(--serif);color:var(--ink);line-height:1.1}.sum span{color:var(--mute);font-size:14.5px}
.live{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;margin:8px 0 14px}
.live i{width:9px;height:9px;border-radius:50%;background:#0e9f6e;box-shadow:0 0 0 4px rgba(14,159,110,.18)}
.pu{display:grid;grid-template-columns:1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(7,23,51,.04),0 8px 22px -14px rgba(7,23,51,.18)}
.pu.has-top{grid-template-columns:1.15fr 1fr}
@media(max-width:700px){.pu.has-top{grid-template-columns:1fr}}
.pl{display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
.pn{flex:0 0 46px;height:60px;border-radius:8px;background:linear-gradient(180deg,#14367e,var(--ink));color:var(--gold2);font:600 26px var(--serif);display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--gold)}
.pt{font:600 17px var(--serif);color:var(--ink);line-height:1.25}
.pst{margin-top:8px;font-size:16px;font-weight:600}
.pst.none{color:#7b86a3}.pst.wait{color:#8a5a00}
.pst.liv{color:#1d4ed8}.pst.liv::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#1d4ed8;margin-right:8px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.res{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.big2{font:700 40px var(--serif);color:var(--ink);line-height:1}
.lv{color:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px;letter-spacing:.03em}
.pos{margin-top:8px;font-size:16px;color:var(--text)}.pos b{color:var(--ink)}
.wr{margin-top:4px;font-size:15px;color:var(--mute)}
.tp{background:linear-gradient(135deg,#fbf4df,#fff);border-left:1px solid var(--line);padding:14px 16px}
@media(max-width:700px){.tp{border-left:0;border-top:1px solid var(--line)}}
.tp h4{margin:0 0 8px;font:700 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#8a6410}
.tr{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:16px}
.tr .m{font-size:22px;width:28px}.tr .nm{flex:1;font-weight:600;color:var(--ink)}.tr .pc{font-weight:800;color:var(--ink)}
.lang{margin-left:auto;display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#dbe4fb;font:700 14px var(--sans);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:#fff;color:var(--ink)}
.hint{margin:8px 0 0;color:var(--mute);font-size:15px}
.allb{background:none;border:0;color:var(--royal);font:700 16px var(--sans);padding:12px 0 2px;cursor:pointer;text-decoration:underline}
.plist.big{max-height:60vh;overflow:auto}
.pas{display:inline-block;font:700 20px var(--serif)}.pas.ok{color:var(--ok)}.pas.no{color:var(--bad)}
.legend{margin:6px 0 12px;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14.5px;color:var(--text)}
.legend b.g{color:var(--ok)}.legend b.r{color:var(--bad)}
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px;border-radius:14px;background:#eaf1ff;border:1px solid #c9d9fb;color:var(--ink);font-size:15.5px}
.tip button{margin-top:8px;border:0;background:var(--royal);color:#fff;font:700 15px var(--sans);padding:9px 18px;border-radius:10px;cursor:pointer}
.foot{text-align:center;color:#9aa6bf;font-size:13px;margin-top:26px}
</style></head><body>
<div class="top"><img src="logo.jpg" alt=""><div><b>NNT School Academy</b><small data-i="sub"></small></div><div class="lang"><button id="l_lat">Lotin</button><button id="l_cyr">Кирилл</button></div></div>
<div class="pwrap">
 <div id="s_find">
  <div class="phero"><img src="logo.jpg" alt=""><h1 data-h="h1"></h1><p data-i="intro"></p></div>
  <div class="card sbox">
   <label for="q" data-i="lbl"></label>
   <input type="search" id="q" autocomplete="off">
   <p class="hint" data-i="hint"></p>
   <div class="plist" id="plist"></div><div id="nf"></div>
   <button class="allb" id="allb" type="button"></button>
  </div>
  <div class="tip" id="tip"><div>📲</div><div><b data-i="tipT"></b><br><span data-i="tipB"></span><br><button id="tipx" type="button" data-i="tipOk"></button></div></div>
 </div>
 <div id="s_kid" class="hide">
  <button class="back2" id="back"></button>
  <div class="kid"><h2 id="kname"></h2></div>
  <div class="sumrow"><div class="sum"><b id="s1">0</b><span data-i="done"></span></div><div class="sum"><b id="s2">–</b><span data-i="avg"></span></div></div>
  <div class="legend" id="legend"></div>
  <div class="live"><i></i><span id="upd"></span></div>
  <div id="units"></div>
 </div>
 <div class="foot">NNT School Academy</div>
</div>
<script src="core.js?v=15"></script>
<script>
var SID = 0, T = null, ROS = null, ALL = false, KNAME = "", LAST = null, LVC = ["#e5365f","#e0409a","#0a9f6e","#ff6a00","#7b2ff7"], MED = ["🥇","🥈","🥉"];
var LANG = ls("nnt_parent_lang") === "cyr" ? "cyr" : "lat";
var D = {
 lat:{sub:"Ota-onalar uchun",intro:"Farzandingizning ismini yozing va uning barcha testlar bo'yicha natijalarini ko'ring.",lbl:"Farzandingizning ismi",ph:"Masalan: Fotima",
  hint:"Ismning boshlanishini yozing va ro'yxatdan o'quvchini tanlang.",all:"Barcha o'quvchilar ro'yxatini ko'rsatish",hide:"Ro'yxatni yashirish",
  nf:"Bunday ism topilmadi. Ismni boshqacha yozib ko'ring (masalan, faqat ismini yoki familiyasini).",net:"Internet bilan aloqa yo'q. Iltimos, qayta urinib ko'ring.",
  tipT:"Telefoningizga saqlab qo'ying",tipB:"Brauzer menyusini oching va «Bosh ekranga qo'shish» tugmasini bosing. Shunda sahifa ilova kabi bir bosishda ochiladi.",tipOk:"Tushunarli",
  back:"← Boshqa o'quvchini qidirish",done:"Bajarilgan testlar",avg:"O'rtacha natija",
  legend:"<b class='g'>O'tdi</b> — 60% va undan yuqori natija. <b class='r'>O'tmadi</b> — 60% dan past natija.",
  upd:"Natijalar avtomatik yangilanib turadi",updAt:"Natijalar avtomatik yangilanib turadi · oxirgi yangilanish ",off:"Internet bilan aloqa yo'q. Qayta urinilmoqda…",
  load:"Yuklanmoqda…",nodata:"Ma'lumot topilmadi.",pass:"O'tdi",fail:"O'tmadi",
  lv:["Qayta urinish kerak","Yaxshi","A'lo","Ajoyib","Afsonaviy"],
  wait:"Test topshirilgan. Natija tez orada e'lon qilinadi.",live:"Hozir test ishlayapti…",none:"Testni bajarmagan",
  rank:function(r,n){return "Sinfdagi o'rni: <b>"+r+"-o'rin</b> ("+n+" nafar o'quvchi ichida)";},wr:"Yozma ish bahosi: ",top:"Eng yaxshi 3 o'quvchi"},
 cyr:{sub:"Ота-оналар учун",intro:"Фарзандингизнинг исмини ёзинг ва унинг барча тестлар бўйича натижаларини кўринг.",lbl:"Фарзандингизнинг исми",ph:"Масалан: Фотима",
  hint:"Исмнинг бошланишини ёзинг ва рўйхатдан ўқувчини танланг.",all:"Барча ўқувчилар рўйхатини кўрсатиш",hide:"Рўйхатни яшириш",
  nf:"Бундай исм топилмади. Исмни бошқачароқ ёзиб кўринг (масалан, фақат исмини ёки фамилиясини).",net:"Интернет билан алоқа йўқ. Илтимос, қайта уриниб кўринг.",
  tipT:"Телефонингизга сақлаб қўйинг",tipB:"Браузер менюсини очинг ва «Бош экранга қўшиш» тугмасини босинг. Шунда саҳифа илова каби бир босишда очилади.",tipOk:"Тушунарли",
  back:"← Бошқа ўқувчини излаш",done:"Бажарилган тестлар",avg:"Ўртача натижа",
  legend:"<b class='g'>Ўтди</b> — 60% ва ундан юқори натижа. <b class='r'>Ўтмади</b> — 60% дан паст натижа.",
  upd:"Натижалар автоматик янгиланиб туради",updAt:"Натижалар автоматик янгиланиб туради · охирги янгиланиш ",off:"Интернет билан алоқа йўқ. Қайта уринилмоқда…",
  load:"Юкланмоқда…",nodata:"Маълумот топилмади.",pass:"Ўтди",fail:"Ўтмади",
  lv:["Қайта уриниш керак","Яхши","Аъло","Ажойиб","Афсонавий"],
  wait:"Тест топширилган. Натижа тез орада эълон қилинади.",live:"Ҳозир тест ишлаяпти…",none:"Тестни бажармаган",
  rank:function(r,n){return "Синфдаги ўрни: <b>"+r+"-ўрин</b> ("+n+" нафар ўқувчи ичида)";},wr:"Ёзма иш баҳоси: ",top:"Энг яхши 3 ўқувчи"}
};
function t(k){ return D[LANG][k]; }
/* Latin -> Cyrillic for names (Uzbek) */
var L2C = [["o'","ў"],["o\u2018","ў"],["o\u02bb","ў"],["g'","ғ"],["g\u2018","ғ"],["g\u02bb","ғ"],["sh","ш"],["ch","ч"],["yo","ё"],["yu","ю"],["ya","я"],["ye","е"],["ts","ц"],["ng","нг"],
 ["a","а"],["b","б"],["d","д"],["e","е"],["f","ф"],["g","г"],["h","ҳ"],["i","и"],["j","ж"],["k","к"],["l","л"],["m","м"],["n","н"],["o","о"],["p","п"],["q","қ"],["r","р"],["s","с"],["t","т"],["u","у"],["v","в"],["x","х"],["y","й"],["z","з"],["w","в"],["'","ъ"],["\u2019","ъ"]];
function capIf(c, up){ return up ? c.charAt(0).toUpperCase() + c.slice(1) : c; }
function toCyr(str){
  return String(str || "").split(/(\s+|-)/).map(function(w){
    var out = "", i = 0, lw = w.toLowerCase();
    while (i < lw.length){
      var hit = null;
      for (var k = 0; k < L2C.length; k++){ if (lw.substr(i, L2C[k][0].length) === L2C[k][0]){ hit = L2C[k]; break; } }
      if (!hit){ out += w.charAt(i); i++; continue; }
      var up = w.charAt(i) !== lw.charAt(i), c = hit[1];
      if (i === 0 && hit[0] === "e") c = "э";
      out += capIf(c, up); i += hit[0].length;
    }
    return out;
  }).join("");
}
var C2L = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sh","э":"e","ю":"yu","я":"ya","ў":"o","ғ":"g","қ":"k","ҳ":"h","ъ":"","ь":"","ы":"i"};
function norm(s){
  s = String(s || "").toLowerCase().replace(/[а-яёўғқҳъь]/g, function(c){ return C2L[c] != null ? C2L[c] : c; });
  return s.replace(/['\u2018\u2019\u02bb\u02bc`´]/g, "").replace(/x/g, "h").replace(/q/g, "k").replace(/w/g, "v").replace(/ts/g, "s").replace(/j/g, "y").replace(/yy+/g, "y").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}
function nm(x){ return LANG === "cyr" ? toCyr(x) : x; }
function applyLang(){
  document.documentElement.lang = LANG === "cyr" ? "uz-Cyrl" : "uz";
  document.title = "NNT School · " + t("sub");
  [].forEach.call(document.querySelectorAll("[data-i]"), function(e){ e.textContent = t(e.getAttribute("data-i")); });
  $("q").placeholder = t("ph"); $("back").textContent = t("back"); $("legend").innerHTML = t("legend");
  document.querySelector("[data-h=h1]").innerHTML = LANG === "cyr" ? "Фарзандингиз <em>натижалари</em>" : "Farzandingiz <em>natijalari</em>";
  $("l_lat").className = LANG === "lat" ? "on" : ""; $("l_cyr").className = LANG === "cyr" ? "on" : "";
  $("allb").textContent = ALL ? t("hide") : t("all");
  find(); if (LAST) draw(LAST); else if (SID) $("kname").textContent = nm(KNAME);
  if (!$("kname").textContent) $("upd").textContent = t("upd"); 
}
$("l_lat").onclick = function(){ LANG = "lat"; ls("nnt_parent_lang", "lat"); applyLang(); };
$("l_cyr").onclick = function(){ LANG = "cyr"; ls("nnt_parent_lang", "cyr"); applyLang(); };
function show(k){ $("s_find").classList.toggle("hide", k !== "find"); $("s_kid").classList.toggle("hide", k !== "kid"); window.scrollTo(0,0); }
function getRoster(){
  if (ROS) return Promise.resolve(ROS);
  return rpc("roster").then(function(r){ ROS = r.map(function(x){ x.k = norm(x.name); return x; }); return ROS; });
}
function listHtml(r){ return r.map(function(x){ return '<div data-id="' + x.id + '" data-n="' + esc(x.name) + '">' + esc(nm(x.name)) + '</div>'; }).join(""); }
function find(){
  var raw = $("q").value.trim(), q = norm(raw), pl = $("plist");
  pl.classList.toggle("big", ALL);
  if (!ALL && q.length < 2){ pl.innerHTML = ""; $("nf").innerHTML = ""; return; }
  getRoster().then(function(R){
    if ($("q").value.trim() !== raw) return;
    var toks = q.split(" ").filter(Boolean);
    var r = R.filter(function(x){ return toks.every(function(w){ return x.k.indexOf(w) > -1; }); });
    if (!ALL) r = r.slice(0, 12);
    if (!r.length){ pl.innerHTML = ""; $("nf").innerHTML = '<div class="nf">' + t("nf") + '</div>'; return; }
    $("nf").innerHTML = ""; pl.innerHTML = listHtml(r);
  }).catch(function(){
    if (raw.length < 2){ $("nf").innerHTML = '<div class="nf">' + t("net") + '</div>'; return; }
    rpc("parent_search", {q: LANG === "cyr" || /[а-яёўғқҳ]/i.test(raw) ? norm(raw) : raw}).then(function(r){ $("nf").innerHTML = r.length ? "" : '<div class="nf">' + t("nf") + '</div>'; pl.innerHTML = listHtml(r); }).catch(function(){ $("nf").innerHTML = '<div class="nf">' + t("net") + '</div>'; });
  });
}
var qt = null; $("q").oninput = function(){ clearTimeout(qt); qt = setTimeout(find, 200); };
$("allb").onclick = function(){ ALL = !ALL; $("allb").textContent = ALL ? t("hide") : t("all"); find(); };
$("plist").onclick = function(e){ var d = e.target.closest("div[data-id]"); if (!d) return; openKid(+d.getAttribute("data-id"), d.getAttribute("data-n")); };
function openKid(id, name){ SID = id; LAST = null; KNAME = name || ""; ls("nnt_parent_sid", String(id)); $("kname").textContent = nm(KNAME); $("units").innerHTML = '<p style="color:var(--mute)">' + t("load") + '</p>'; show("kid"); load(); }
$("back").onclick = function(){ SID = 0; LAST = null; ls("nnt_parent_sid", null); clearInterval(T); $("q").value = ""; ALL = false; $("allb").textContent = t("all"); $("plist").innerHTML = ""; $("nf").innerHTML = ""; show("find"); };
function draw(d){
  LAST = d; KNAME = d.name; $("kname").textContent = nm(d.name);
  var done = 0, sum = 0, cnt = 0, h = "";
  d.units.forEach(function(u){
    var top = u.top && u.top.length, st = "", left = "";
    if (u.state === "done"){
      done++; sum += +u.pct; cnt++;
      var ok = +u.pct >= 60;
      st = '<div class="pas ' + (ok ? "ok" : "no") + '">' + (ok ? "✓ " + t("pass") : "✕ " + t("fail")) + '</div>' +
           '<div class="res"><span class="big2">' + Math.round(u.pct) + '%</span><span class="lv" style="background:' + LVC[u.level] + '">' + t("lv")[u.level] + '</span></div>' +
           '<div class="pos">' + t("rank")(u.rank, u.n) + '</div>' +
           (u.ws != null ? '<div class="wr">' + t("wr") + '<b>' + (u.no >= 19 ? Math.min(9, u.ws) + ' / 9' : u.ws + ' / 10') + '</b></div>' : '');
    } else if (u.state === "wait"){ done++; st = '<div class="pst wait">' + t("wait") + '</div>'; }
    else if (u.state === "live"){ st = '<div class="pst liv">' + t("live") + '</div>'; }
    else st = '<div class="pst none">' + t("none") + '</div>';
    left = '<div class="pl"><div class="pn">' + u.no + '</div><div><div class="pt">' + esc(u.title.replace(/^Unit \d+ · /, "")) + '</div>' + st + '</div></div>';
    var right = top ? '<div class="tp"><h4>' + t("top") + '</h4>' + u.top.map(function(x, i){ return '<div class="tr"><span class="m">' + MED[i] + '</span><span class="nm">' + esc(nm(x.name)) + '</span><span class="pc">' + Math.round(x.pct) + '%</span></div>'; }).join("") + '</div>' : "";
    h += '<div class="pu' + (top ? " has-top" : "") + '">' + left + right + '</div>';
  });
  $("units").innerHTML = h;
  $("s1").textContent = done + " / " + d.units.length; $("s2").textContent = cnt ? Math.round(sum / cnt) + "%" : "–";
  var n = new Date(); $("upd").textContent = t("updAt") + ("0" + n.getHours()).slice(-2) + ":" + ("0" + n.getMinutes()).slice(-2);
}
function load(){
  if (!SID) return;
  rpc("parent_view", {p_sid: SID}).then(function(d){ if (!d || !d.ok){ $("units").innerHTML = '<div class="nf">' + t("nodata") + '</div>'; return; } draw(d); }).catch(function(){ $("upd").textContent = t("off"); });
  clearInterval(T); T = setInterval(function(){ if (!document.hidden) load(); }, 8000);
}
var tipHide = ls("nnt_parent_tip") === "1" || (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
if (tipHide) $("tip").style.display = "none";
$("tipx").onclick = function(){ ls("nnt_parent_tip", "1"); $("tip").style.display = "none"; };
applyLang();
(function(){ var s = +ls("nnt_parent_sid"); if (s){ openKid(s, ""); } else show("find"); })();
</script></body></html>
