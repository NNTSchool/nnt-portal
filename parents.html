<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>NNT School · Ota-onalar uchun</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.pwrap{max-width:900px;margin:0 auto;padding:18px 14px 60px}
.phero{position:relative;overflow:hidden;border-radius:22px;padding:26px 18px 22px;text-align:center;color:#fff;background:radial-gradient(120% 90% at 15% 0%,#1d4fbf 0%,#0b2a6e 45%,#071733 100%);border:1.5px solid rgba(239,220,168,.55);box-shadow:0 14px 34px -14px rgba(7,23,51,.55)}
.phero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 10%,rgba(239,220,168,.28),transparent 40%);pointer-events:none}
.phero>*{position:relative}
.phero img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2.5px solid var(--gold2);box-shadow:0 0 0 6px rgba(200,150,58,.22);margin-bottom:8px}
.phero h1{color:#fff;font-size:28px;margin:2px 0 6px}.phero h1 em{font-style:normal;background:linear-gradient(90deg,#fff1b8,#ffc93c,#ff8fb8);-webkit-background-clip:text;background-clip:text;color:transparent}
.phero p{margin:0 auto;max-width:440px;color:#dbe4fb;font-size:16px}
.sbox{margin-top:14px;border-top:3px solid var(--gold);border-radius:18px}
.sbox label{font-size:17px;color:var(--ink);margin:0 0 8px}
#q{font-size:20px;padding:16px 16px}
.plist div{padding:16px 14px;font-size:19px;font-weight:600;border-bottom:1px solid var(--line);cursor:pointer}
.plist div:active,.plist div:hover{background:var(--gold3)}
.plist{border:1.5px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:#fff}
.plist:empty{display:none}
.nf{margin-top:12px;padding:14px;border-radius:12px;background:#fff6e0;color:#7a4300;font-size:16px}
.back2{background:none;border:0;color:var(--royal);font:700 17px var(--sans);padding:10px 0;cursor:pointer}
.kid{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.kid h2{font-size:28px}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.sum{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:12px 14px}
.sum b{display:block;font:700 30px var(--serif);color:var(--ink);line-height:1.1}.sum span{color:var(--mute);font-size:14.5px}
.live{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;margin:8px 0 14px}
.live i{width:9px;height:9px;border-radius:50%;background:#0e9f6e;box-shadow:0 0 0 4px rgba(14,159,110,.18)}
.pu{display:grid;grid-template-columns:1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(7,23,51,.04),0 8px 22px -14px rgba(7,23,51,.18)}
.pu.has-top{grid-template-columns:1.15fr 1fr}
@media(max-width:700px){.pu.has-top{grid-template-columns:1fr}}
.pl{display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
.pn{flex:0 0 46px;height:60px;border-radius:8px;background:linear-gradient(180deg,#14367e,var(--ink));color:var(--gold2);font:600 26px var(--serif);display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--gold)}
.pt{font:600 17px var(--serif);color:var(--ink);line-height:1.25}
.pst{margin-top:8px;font-size:16px;font-weight:600}
.pst.none{color:#7b86a3}.pst.wait{color:#8a5a00}
.pst.liv{color:#1d4ed8}.pst.liv::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#1d4ed8;margin-right:8px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.res{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.big2{font:700 40px var(--serif);color:var(--ink);line-height:1}
.lv{color:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px;letter-spacing:.03em}
.pos{margin-top:8px;font-size:16px;color:var(--text)}.pos b{color:var(--ink)}
.wr{margin-top:4px;font-size:15px;color:var(--mute)}
.tp{background:linear-gradient(135deg,#fbf4df,#fff);border-left:1px solid var(--line);padding:14px 16px}
@media(max-width:700px){.tp{border-left:0;border-top:1px solid var(--line)}}
.tp h4{margin:0 0 8px;font:700 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#8a6410}
.tr{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:16px}
.tr .m{font-size:22px;width:28px}.tr .nm{flex:1;font-weight:600;color:var(--ink)}.tr .pc{font-weight:800;color:var(--ink)}
.foot{text-align:center;color:#9aa6bf;font-size:13px;margin-top:26px}
</style></head><body>
<div class="top"><img src="logo.jpg" alt=""><div><b>NNT School Academy</b><small>Ota-onalar uchun</small></div></div>
<div class="pwrap">
 <div id="s_find">
  <div class="phero"><img src="logo.jpg" alt=""><h1>Farzandingiz <em>natijalari</em></h1><p>Farzandingizning ismini yozing va uning barcha testlar bo'yicha natijalarini ko'ring.</p></div>
  <div class="card sbox">
   <label for="q">Farzandingizning ismi</label>
   <input type="search" id="q" placeholder="Masalan: Fotima" autocomplete="off">
   <div class="plist" id="plist"></div><div id="nf"></div>
  </div>
 </div>
 <div id="s_kid" class="hide">
  <button class="back2" id="back">← Boshqa o'quvchini qidirish</button>
  <div class="kid"><h2 id="kname"></h2></div>
  <div class="sumrow"><div class="sum"><b id="s1">0</b><span>Bajarilgan testlar</span></div><div class="sum"><b id="s2">–</b><span>O'rtacha natija</span></div></div>
  <div class="live"><i></i><span id="upd">Natijalar avtomatik yangilanib turadi</span></div>
  <div id="units"></div>
 </div>
 <div class="foot">NNT School Academy</div>
</div>
<script src="core.js?v=13"></script>
<script>
var SID = 0, T = null, LVN = ["Qayta urinish kerak","Yaxshi","A'lo","Ajoyib","Afsonaviy"], LVC = ["#e5365f","#e0409a","#0a9f6e","#ff6a00","#7b2ff7"], MED = ["🥇","🥈","🥉"];
function show(k){ $("s_find").classList.toggle("hide", k !== "find"); $("s_kid").classList.toggle("hide", k !== "kid"); window.scrollTo(0,0); }
function find(){
  var q = $("q").value.trim();
  if (q.length < 2){ $("plist").innerHTML = ""; $("nf").innerHTML = ""; return; }
  var my = q;
  rpc("parent_search", {q: q}).then(function(r){
    if ($("q").value.trim() !== my) return;
    if (!r.length){ $("plist").innerHTML = ""; $("nf").innerHTML = '<div class="nf">Bunday ism topilmadi. Ismni boshqacha yozib ko\'ring (masalan, faqat ismini yoki familiyasini).</div>'; return; }
    $("nf").innerHTML = ""; $("plist").innerHTML = r.map(function(x){ return '<div data-id="' + x.id + '" data-n="' + esc(x.name) + '">' + esc(x.name) + '</div>'; }).join("");
  }).catch(function(){ $("nf").innerHTML = '<div class="nf">Internet bilan aloqa yo\'q. Iltimos, qayta urinib ko\'ring.</div>'; });
}
var qt = null; $("q").oninput = function(){ clearTimeout(qt); qt = setTimeout(find, 250); };
$("plist").onclick = function(e){ var d = e.target.closest("div[data-id]"); if (!d) return; openKid(+d.getAttribute("data-id"), d.getAttribute("data-n")); };
function openKid(id, name){ SID = id; ls("nnt_parent_sid", String(id)); $("kname").textContent = name || ""; $("units").innerHTML = '<p style="color:var(--mute)">Yuklanmoqda…</p>'; show("kid"); load(); }
$("back").onclick = function(){ SID = 0; ls("nnt_parent_sid", null); clearInterval(T); $("q").value = ""; $("plist").innerHTML = ""; $("nf").innerHTML = ""; show("find"); };
function draw(d){
  $("kname").textContent = d.name;
  var done = 0, sum = 0, cnt = 0, h = "";
  d.units.forEach(function(u){
    var top = u.top && u.top.length, st = "", left = "";
    if (u.state === "done"){
      done++; sum += +u.pct; cnt++;
      st = '<div class="res"><span class="big2">' + Math.round(u.pct) + '%</span><span class="lv" style="background:' + LVC[u.level] + '">' + LVN[u.level] + '</span></div>' +
           '<div class="pos">Sinfdagi o\'rni: <b>' + u.rank + '-o\'rin</b> (' + u.n + ' nafar o\'quvchi ichida)</div>' +
           (u.ws != null ? '<div class="wr">Yozma ish bahosi: <b>' + u.ws + ' / 10</b></div>' : '');
    } else if (u.state === "wait"){ done++; st = '<div class="pst wait">Test topshirilgan. Natija tez orada e\'lon qilinadi.</div>'; }
    else if (u.state === "live"){ st = '<div class="pst liv">Hozir test ishlayapti…</div>'; }
    else st = '<div class="pst none">Testni bajarmagan</div>';
    left = '<div class="pl"><div class="pn">' + u.no + '</div><div><div class="pt">' + esc(u.title.replace(/^Unit \d+ · /, "")) + '</div>' + st + '</div></div>';
    var right = top ? '<div class="tp"><h4>Eng yaxshi 3 o\'quvchi</h4>' + u.top.map(function(x, i){ return '<div class="tr"><span class="m">' + MED[i] + '</span><span class="nm">' + esc(x.name) + '</span><span class="pc">' + Math.round(x.pct) + '%</span></div>'; }).join("") + '</div>' : "";
    h += '<div class="pu' + (top ? " has-top" : "") + '">' + left + right + '</div>';
  });
  $("units").innerHTML = h;
  $("s1").textContent = done + " / " + d.units.length; $("s2").textContent = cnt ? Math.round(sum / cnt) + "%" : "–";
  var t = new Date(); $("upd").textContent = "Natijalar avtomatik yangilanib turadi · oxirgi yangilanish " + ("0" + t.getHours()).slice(-2) + ":" + ("0" + t.getMinutes()).slice(-2);
}
function load(){
  if (!SID) return;
  rpc("parent_view", {p_sid: SID}).then(function(d){ if (!d || !d.ok){ $("units").innerHTML = '<div class="nf">Ma\'lumot topilmadi.</div>'; return; } draw(d); }).catch(function(){ $("upd").textContent = "Internet bilan aloqa yo'q. Qayta urinilmoqda…"; });
  clearInterval(T); T = setInterval(function(){ if (!document.hidden) load(); }, 8000);
}
(function(){ var s = +ls("nnt_parent_sid"); if (s){ openKid(s, ""); } else show("find"); })();
</script></body></html>
